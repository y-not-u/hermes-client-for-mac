name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build macOS Application
    runs-on: macos-15-intel
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Tests
        run: |
          python3 script/test_ci_signing.py
          python3 script/test_prepare_update.py
          ./script/test.sh

      - name: Set Release Version
        env:
          HERMES_REF_TYPE: ${{ github.ref_type }}
          HERMES_REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$HERMES_REF_TYPE" = "tag" ]; then
            python3 script/prepare_update.py metadata --tag "$HERMES_REF_NAME" --build "$GITHUB_RUN_NUMBER" --github-env "$GITHUB_ENV"
          else
            python3 script/prepare_update.py metadata --build "$GITHUB_RUN_NUMBER" --github-env "$GITHUB_ENV"
          fi

      - name: Set up CI Signing
        if: github.event_name != 'pull_request'
        timeout-minutes: 2
        # The helper authenticates its parent using the signing certificate.
        # Reuse the same identity across releases; never generate a replacement.
        env:
          HERMES_SIGNING_P12_BASE64: ${{ secrets.HERMES_SIGNING_P12_BASE64 }}
          HERMES_SIGNING_P12_PASSWORD: ${{ secrets.HERMES_SIGNING_P12_PASSWORD }}
        run: |
          ./script/setup_ci_signing.sh

      - name: Set up Pull Request Signing
        if: github.event_name == 'pull_request'
        timeout-minutes: 2
        # Fork PRs have no release secrets. This identity is for validation only.
        run: |
          ./script/setup_ci_signing.sh

      - name: Build Application (Release)
        run: |
          xcodebuild -project HermesMac.xcodeproj \
            -scheme HermesMac \
            -configuration Release \
            -derivedDataPath build \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$HERMES_SIGNING_IDENTITY" \
            MARKETING_VERSION="$HERMES_MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$HERMES_BUILD_NUMBER" \
            build

      - name: Remove CI Signing Keychain
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/hermes-signing.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/hermes-signing.keychain-db"
          fi

      - name: Verify Application
        run: |
          codesign --verify --deep --strict --verbose=2 build/Build/Products/Release/HermesMac.app
          codesign --verify --strict --verbose=2 build/Build/Products/Release/HermesMac.app/Contents/MacOS/HermesCredentialHelper
          lipo build/Build/Products/Release/HermesMac.app/Contents/MacOS/HermesMac -verify_arch arm64 x86_64
          lipo build/Build/Products/Release/HermesMac.app/Contents/MacOS/HermesCredentialHelper -verify_arch arm64 x86_64

      - name: Package HermesMac.app
        run: |
          APP_PATH="build/Build/Products/Release/HermesMac.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Error: HermesMac.app not found at $APP_PATH"
            exit 1
          fi
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" HermesMac.zip
          shasum -a 256 HermesMac.zip > HermesMac.zip.sha256
          echo "Package created successfully: HermesMac.zip"
          cat HermesMac.zip.sha256

      - name: Generate Signed Update Feed
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          HERMES_RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 script/prepare_update.py appcast \
            --tag "$HERMES_RELEASE_TAG" \
            --archive HermesMac.zip \
            --output-dir "$RUNNER_TEMP/hermes-update" \
            --sparkle-bin build/SourcePackages/artifacts/sparkle/Sparkle/bin
          cp "$RUNNER_TEMP/hermes-update/appcast.xml" appcast.xml

      - name: Upload Build Artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: HermesMac-macOS
          path: |
            HermesMac.zip
            HermesMac.zip.sha256
            appcast.xml
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            HermesMac.zip
            HermesMac.zip.sha256
            appcast.xml
          generate_release_notes: true
